name: Documentation
description: Update or add documentation
title: "[DOCS]: "
labels: ["Type: Documentation", "Status: Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this out!
        We're temporarily using an issue-first model (pull requests are currently limited to maintainers). Please search existing issues first and add a 👍 if this is already tracked, or share clear details below so maintainers can prioritize and address it.

  - type: textarea
    id: describe-need
    attributes:
      label: Describe the need
      description: What do you wish was different about our docs?
      placeholder: Describe the need for documentation updates here.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
        Please check your logs before submission to ensure sensitive information is redacted.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/integrations/terraform-provider-github/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
